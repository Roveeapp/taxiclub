name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
